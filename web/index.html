<!doctype html>
<!--
模块职责：提供 v0.3 任务化知识审阅工作台的页面结构。
设计关联（DesignRef）：docs/design/web-workbench.md
实现状态：Current
关联测试：tests/test_v03_api.py
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axiom-Flow</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Axiom-Flow <span>v0.3</span></div>
    <div id="document-status" class="status">尚未选择文档</div>
  </header>
  <main class="shell">
    <aside class="sidebar">
      <form id="upload-form" class="upload-form">
        <label for="pdf-file">导入 PDF</label>
        <input id="pdf-file" type="file" accept="application/pdf" required>
        <button type="submit">导入文档</button>
      </form>
      <div class="sidebar-title">文档库</div>
      <nav id="document-list" aria-label="文档库"></nav>
    </aside>
    <section class="workspace">
      <nav class="tabs" aria-label="工作视图">
        <button class="tab active" data-view="pages">页面审阅</button>
        <button class="tab" data-view="knowledge">知识候选</button>
        <button class="tab" data-view="workbook">工作簿发布</button>
        <button class="tab" data-view="graph">知识图谱</button>
      </nav>
      <div id="notice" class="notice" role="status"></div>
      <section id="job-panel" class="job-panel" aria-live="polite" hidden>
        <div><strong id="job-kind">后台任务</strong><span id="job-state" class="job-state"></span></div>
        <progress id="job-progress" value="0" max="1"></progress>
        <button id="cancel-job-button" class="reject" type="button">取消任务</button>
      </section>
      <section id="pages-view" class="view active">
        <div class="view-bar">
          <h1>页面质量审阅</h1>
          <div class="actions">
            <button id="history-button" type="button" title="解析历史">历史</button>
            <button id="parse-button" class="command" type="button">开始解析</button>
          </div>
        </div>
        <section id="run-toolbar" class="run-toolbar" hidden></section>
        <div id="review-workspace" class="review-workspace" hidden>
          <aside class="page-navigator" aria-label="页面导航">
            <div class="navigator-tools">
              <input id="page-filter" type="search" placeholder="筛选页码或问题" aria-label="筛选页面">
              <label><input id="issues-only" type="checkbox"> 仅问题页</label>
            </div>
            <nav id="page-index" aria-label="解析页面"></nav>
          </aside>
          <section class="page-inspector">
            <div class="page-controls">
              <button id="previous-page" type="button" title="上一页" aria-label="上一页">&#8592;</button>
              <label>第 <input id="page-number" type="number" min="1" aria-label="页码"> 页</label>
              <button id="next-page" type="button" title="下一页" aria-label="下一页">&#8594;</button>
              <span class="control-spacer"></span>
              <button id="fit-width" type="button">适合宽度</button>
              <button id="zoom-out" type="button" title="缩小" aria-label="缩小">&#8722;</button>
              <output id="zoom-level">100%</output>
              <button id="zoom-in" type="button" title="放大" aria-label="放大">&#43;</button>
            </div>
            <div class="comparison">
              <section class="source-pane">
                <header><h2>原始页图</h2><span id="page-state" class="meta"></span></header>
                <div id="image-stage" class="image-stage"><img id="page-image" alt=""></div>
              </section>
              <section class="ocr-pane">
                <header><h2>当前 OCR</h2><span id="page-issues" class="issues"></span></header>
                <nav class="content-tabs" aria-label="OCR 内容格式">
                  <button class="content-tab active" data-content="readable" type="button">阅读</button>
                  <button class="content-tab" data-content="markdown" type="button">Markdown</button>
                  <button class="content-tab" data-content="blocks" type="button">Blocks JSON</button>
                </nav>
                <div id="ocr-content" class="ocr-content"></div>
                <div id="page-review"></div>
              </section>
            </div>
            <nav id="artifact-downloads" class="artifact-downloads" aria-label="产物下载"></nav>
          </section>
        </div>
        <div id="empty-pages" class="empty-state">尚未选择可用的当前解析运行</div>
        <aside id="history-drawer" class="history-drawer" hidden>
          <div class="drawer-header"><h2>解析历史</h2><button id="close-history" type="button" title="关闭" aria-label="关闭">&#215;</button></div>
          <div id="run-history"></div>
        </aside>
      </section>
      <section id="knowledge-view" class="view">
        <div class="view-bar"><h1>知识候选与关系</h1><button id="extract-button" class="command">生成候选</button></div>
        <div id="candidates" class="candidate-list"></div>
        <div id="edges" class="edge-list"></div>
      </section>
      <section id="workbook-view" class="view">
        <div class="view-bar"><h1>工作簿发布</h1><div class="actions"><button id="export-button">导出草稿</button><a id="download-workbook" href="#" hidden>下载工作簿</a><button id="publish-button" class="command">显式发布</button></div></div>
        <form id="workbook-form" class="import-form"><input id="workbook-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required><button type="submit">导入并校验</button></form>
        <pre id="workbook-detail" class="detail"></pre>
      </section>
      <section id="graph-view" class="view">
        <div class="view-bar"><h1>已发布知识图谱</h1><button id="graph-button">刷新</button></div>
        <div id="graph" class="graph"></div>
      </section>
    </section>
  </main>
  <dialog id="parse-dialog">
    <form id="parse-form" method="dialog">
      <h2>新建解析任务</h2>
      <div class="range-fields">
        <label>起始页<input id="parse-start" type="number" min="1" required></label>
        <label>结束页<input id="parse-end" type="number" min="1" required></label>
      </div>
      <p id="parse-budget" class="meta"></p>
      <div class="dialog-actions"><button value="cancel">取消</button><button id="confirm-parse" class="command" value="default">提交</button></div>
    </form>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
