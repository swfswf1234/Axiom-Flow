name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AXIOM_MYSQL_HOST: 127.0.0.1
      AXIOM_MYSQL_PORT: 3306
      AXIOM_MYSQL_USER: root
      AXIOM_MYSQL_PASSWORD: test-password
      AXIOM_MYSQL_DATABASE: axiom_flow_runtime_guard
      AXIOM_MYSQL_TEST_DATABASE: axiom_flow_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check backend evaluation tests
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest-output.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            {
              echo "### pytest failure"
              echo '```text'
              tail -n 200 pytest-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            summary=$(tail -n 12 pytest-output.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=pytest failed::$summary"
          fi
          exit "$test_status"
