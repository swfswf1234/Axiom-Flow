name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: node --check web/app.js
      - run: git diff --check

  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m pytest tests/unit tests/contract -q
          --cov=axiom_flow --cov=evaluation
          --cov-report=term-missing --cov-report=xml:coverage-fast.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-fast
          path: coverage-fast.xml

  integration-system-tests:
    needs: [quality, fast-tests]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AXIOM_MYSQL_HOST: 127.0.0.1
      AXIOM_MYSQL_PORT: 3306
      AXIOM_MYSQL_USER: root
      AXIOM_MYSQL_PASSWORD: test-password
      AXIOM_MYSQL_DATABASE: axiom_flow_runtime_guard
      AXIOM_MYSQL_TEST_DATABASE: axiom_flow_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m pytest tests/integration tests/system -q
          --cov=axiom_flow --cov=evaluation
          --cov-report=term-missing --cov-report=xml:coverage-integration-system.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-system
          path: coverage-integration-system.xml

  process-smoke:
    needs: integration-system-tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AXIOM_MYSQL_HOST: 127.0.0.1
      AXIOM_MYSQL_PORT: 3306
      AXIOM_MYSQL_USER: root
      AXIOM_MYSQL_PASSWORD: test-password
      AXIOM_MYSQL_DATABASE: axiom_flow_runtime_guard
      AXIOM_MYSQL_TEST_DATABASE: axiom_flow_test
      AXIOM_MYSQL_SMOKE_DATABASE: axiom_flow_smoke
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/smoke -q
