name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AXIOM_MYSQL_HOST: 127.0.0.1
      AXIOM_MYSQL_PORT: 3306
      AXIOM_MYSQL_USER: root
      AXIOM_MYSQL_PASSWORD: test-password
      AXIOM_MYSQL_DATABASE: axiom_flow_runtime_guard
      AXIOM_MYSQL_TEST_DATABASE: axiom_flow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check backend evaluation tests
      - run: python -m pytest -q
