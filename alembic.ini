# Module: Configure Alembic CLI paths, imports, and logging.
# DesignRef: docs/architecture/data-lifecycle.md
# Status: Current
# Tests: tests/test_mysql_migrations.py

[alembic]
script_location = %(here)s/src/axiom_flow/migrations
prepend_sys_path = %(here)s/src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys =

[formatters]
keys = generic

[logger_root]
level = WARN
handlers =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
