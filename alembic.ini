# Axiom-Flow af_* table migrations (Alembic; qed database, af_* namespace).
# NOTE: keep this file ASCII-only (configparser reads it with locale encoding on Windows).
[alembic]
script_location = %(here)s/src/axiom_flow/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# Empty = resolved by env.py: -x db_url > AXIOM_DB_URL > this option > QED_DB_* (config.load_settings)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
